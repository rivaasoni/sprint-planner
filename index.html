<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprint · 10-Week Planner and Coach</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2228%22 fill=%22%230E9F9A%22/><path d=%22M50 24 14 42l36 18 36-18-36-18Zm-22 26v14c0 6 10 11 22 11s22-5 22-11V50%22 fill=%22none%22 stroke=%22white%22 stroke-width=%228%22 stroke-linejoin=%22round%22 stroke-linecap=%22round%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F8; --grid:rgba(60,80,160,.07); --surface:#FFFFFF; --surface2:#E8ECF6; --ink:#1B1F3B; --muted:#5A6283; --line:#DADFED;
  --accent:#3C50E0; --coach:#0E9F9A; --app:#3C50E0; --learn:#8B5CF6; --gym:#D98200; --cook:#0E9F6E;
  --ok:#0E9F6E; --bad:#D6405A; --code:#131830; --codeink:#E6EAFF;
  --shadow:0 1px 0 rgba(27,31,59,.04),0 10px 24px -14px rgba(27,31,59,.22);
  --head:"Sora","Trebuchet MS",system-ui,sans-serif; --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1126; --grid:rgba(150,170,255,.05); --surface:#161B36; --surface2:#20274A; --ink:#E9EDFB; --muted:#9BA4C8; --line:#2A3258;
  --accent:#7D8DFF; --coach:#2CC7C0; --app:#7D8DFF; --learn:#B493FF; --gym:#F5A524; --cook:#34D399; --ok:#34D399; --bad:#FF7A93; --code:#0A0D1F;
  --shadow:0 10px 24px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1126; --grid:rgba(150,170,255,.05); --surface:#161B36; --surface2:#20274A; --ink:#E9EDFB; --muted:#9BA4C8; --line:#2A3258;
  --accent:#7D8DFF; --coach:#2CC7C0; --app:#7D8DFF; --learn:#B493FF; --gym:#F5A524; --cook:#34D399; --ok:#34D399; --bad:#FF7A93; --code:#0A0D1F;
  --shadow:0 10px 24px -14px rgba(0,0,0,.6); color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--head);letter-spacing:-.02em;margin:0}
code{font-family:var(--mono);font-size:.84em;background:var(--surface2);padding:1px 6px;border-radius:6px}

/* layout */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:20px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .logo{width:38px;height:38px;border-radius:12px;background:var(--coach);display:grid;place-items:center}
.brand b{font-family:var(--head);font-size:1.2rem;letter-spacing:-.03em}
.brand small{display:block;color:var(--muted);font-size:.78rem;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-radius:12px;background:none;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav svg{width:20px;height:20px;flex:0 0 20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sideprog{margin-top:auto;padding:12px;border-radius:14px;background:var(--surface2);display:flex;gap:12px;align-items:center}
.sideprog .big{font-family:var(--head);font-weight:700;font-size:1.3rem;line-height:1}
.sideprog small{color:var(--muted)}
.main{padding:26px clamp(16px,3.2vw,44px) 96px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px;min-width:0}
.inner{max-width:1000px;margin:0 auto}
.mainhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.mainhead h1{font-size:clamp(1.5rem,3.6vw,2.1rem);line-height:1.15}
.mainhead p{margin:4px 0 0;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s}
.trk{position:relative;margin-bottom:22px}
.trk .bar{overflow:visible}
.trk .bar>i{position:absolute;left:0;top:0}
.marker{position:absolute;top:-4px;width:3px;height:18px;border-radius:2px;background:var(--ink);opacity:.6}
.trklabels{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.84rem;margin-top:6px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;border-right:0;border-top:1px solid var(--line)}
  .brand,.sideprog{display:none}
  .nav{flex-direction:row;width:100%;overflow-x:auto;overflow-y:hidden}
  .nav button{flex:0 0 auto;flex-direction:column;gap:2px;min-width:68px;padding:6px 8px;font-size:.7rem;align-items:center;text-align:center}
  .main{padding-top:calc(18px + env(safe-area-inset-top,0px))}
}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto}
.muted{color:var(--muted)} .small{font-size:.87rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:600;line-height:1.2}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.coach{background:var(--coach);border-color:var(--coach);color:#fff}
.btn.sm{padding:5px 10px;font-size:.84rem;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=time],input[type=date],select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-width:0}
input[type=number]{width:76px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}
.chip{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.chip.late{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill{padding:6px 12px;border-radius:99px;font-weight:600;font-size:.88rem;background:var(--surface);border:1px solid var(--line)}
.pill.ahead{color:var(--ok)} .pill.behind{color:var(--bad)} .pill.on{color:var(--accent)}
.empty{color:var(--muted);padding:8px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.big{font-family:var(--head);font-size:2.2rem;font-weight:700;line-height:1}
.field{display:grid;gap:4px;margin-bottom:12px}.field label{font-weight:600;font-size:.9rem}

/* seg control */
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* coach */
.avatar{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:var(--coach);display:grid;place-items:center}
.avatar svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.msg{display:flex;gap:12px;margin:14px 0;align-items:flex-start}
.msg.me{justify-content:flex-end}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:6px 20px 20px 20px;padding:14px 18px;max-width:min(100%,740px);box-shadow:var(--shadow);min-width:0}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
.bubble.me{background:var(--ink);color:var(--bg);border-color:var(--ink);border-radius:20px 6px 20px 20px}
.bubble.me pre{background:rgba(255,255,255,.1)}
.bubble.fb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.bubble.fb.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.tag{display:inline-block;font-size:.78rem;font-weight:700;color:var(--coach);margin-bottom:4px}
.terms{margin:8px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px}
.terms dt{font-weight:700}.terms dd{margin:0}
@media(max-width:560px){.terms{grid-template-columns:1fr;gap:0}.terms dd{margin-bottom:6px}}
pre{background:var(--code);color:var(--codeink);border-radius:12px;padding:12px 14px;margin:8px 0;overflow:auto;font-family:var(--mono);font-size:.86rem;line-height:1.55;white-space:pre}
pre .k{color:#8FA2FF;font-weight:500}pre .s{color:#7DE0B0}pre .n{color:#FFC26B}pre .c{color:#7A84AD;font-style:italic}
pre.out{background:var(--surface2);color:var(--ink)}
.note{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.editor{margin:0 0 0 54px}
.editor textarea{width:100%;min-height:118px;resize:vertical;background:var(--code);color:var(--codeink);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-family:var(--mono);font-size:.88rem;line-height:1.55}
.editor textarea:focus{border-color:var(--accent);outline:none}
.editor .row{margin-top:8px}
.tbls{color:var(--muted);font-size:.84rem;margin-top:8px}
.tbls code{background:var(--surface2)}
.rt{margin:8px 0 0 54px;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:760px}
.msg .rt,.bubble .rt{margin-left:0}
.rt table{border-collapse:collapse;width:100%;font-size:.86rem;font-family:var(--mono)}
.rt th,.rt td{padding:6px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.rt th{background:var(--surface2);font-weight:600}
.rt tr:last-child td{border-bottom:0}
.rt .nl{color:var(--muted);font-style:italic}
.rt .more{padding:6px 12px;color:var(--muted);font-size:.82rem}
.err{margin:8px 0 0 54px;color:var(--bad);font-family:var(--mono);font-size:.84rem}
.opts{display:grid;gap:8px;margin:0 0 0 54px;max-width:740px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-family:var(--mono);font-size:.88rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface));opacity:.8}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.opt.plain{font-family:var(--body);font-size:.95rem}
.lhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.dots{display:flex;gap:5px}.dots i{width:22px;height:6px;border-radius:4px;background:var(--surface2)}.dots i.on{background:var(--coach)}
.cont{margin:6px 0 0 54px}
.hero{display:flex;gap:16px;align-items:flex-start}
.hero .avatar{width:56px;height:56px;flex-basis:56px;border-radius:18px}.hero .avatar svg{width:32px;height:32px}
.lessonrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.lessonrow:first-child{border-top:0}
.lessonrow .nm{flex:1;min-width:0}.lessonrow .nm b{overflow-wrap:anywhere}
.lessonrow.done .nm b{color:var(--muted)}
.tip{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.btns{display:flex;gap:6px;flex-wrap:wrap}

/* today */
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.daynav .t{font-family:var(--head);font-weight:600;font-size:1.15rem}
.timeline{display:flex;height:46px;border-radius:14px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line);background:var(--surface)}
.timeline div{display:flex;align-items:center;padding:0 12px;color:#fff;font-weight:600;font-size:.84rem;white-space:nowrap;overflow:hidden;background:var(--c);min-width:0}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.block{padding:0;overflow:hidden}
.block .bh{padding:14px 18px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border-bottom:1px solid var(--line)}
.block h3{font-size:1.1rem;display:flex;align-items:center;gap:10px}
.block .ico{width:32px;height:32px;border-radius:10px;background:var(--c);display:grid;place-items:center;font-size:1rem}
.cfg{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted);flex-wrap:wrap}
.cfg input{padding:4px 6px}
.block .bb{padding:6px 18px 16px}
.block .bar>i{background:var(--c)}
.blockbar{margin:12px 0 0}
.barlabels{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-top:5px}
.task{display:grid;grid-template-columns:auto 64px 1fr;gap:12px;align-items:center;padding:12px 6px;border-top:1px solid var(--line)}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task.running{background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:14px}
.ring{position:relative;width:64px;height:64px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--surface2)}.ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:.78rem}
.ttl{font-weight:600;overflow-wrap:anywhere}
.tmeta{color:var(--muted);font-size:.84rem}
.tbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.addrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addrow input[type=text]{flex:1 1 160px}
.coachstrip{margin-bottom:16px}
@media(max-width:520px){.task{grid-template-columns:auto 56px 1fr}.ring,.ring svg{width:56px;height:56px}}

/* plan */
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px}
.week.current{border:2px solid var(--accent)}
.week h3{font-size:1.05rem}
table.tb{width:100%;border-collapse:collapse}
.tb th,.tb td{text-align:left;padding:8px 6px;border-top:1px solid var(--line)}
.tb th{color:var(--muted);font-weight:600;font-size:.84rem}
.tablewrap{overflow-x:auto}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;margin-top:10px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.stackbar{width:100%;max-width:56px;display:flex;flex-direction:column-reverse;border-radius:10px;overflow:hidden;background:var(--surface2)}
.stackbar i{display:block;width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c);margin-right:6px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M6 10.5V15c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/></svg></div><div><b>Sprint</b><small>planner + coach</small></div></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="sideprog" id="sideprog"></div>
  </aside>
  <main class="main"><div class="inner" id="inner"></div></main>
</div>

<script>
"use strict";
/*DATA_START*/
/* ============ CURRICULUM ============ */
const TOPICS = [
  {id:"sql-1", b:"sql", w:1, n:"SELECT and WHERE", tip:"<code>SELECT name FROM t WHERE age &gt; 30</code>"},
  {id:"sql-2", b:"sql", w:1, n:"Sorting (ORDER BY)", tip:"<code>ORDER BY col DESC</code> plus <code>LIMIT</code> for top-N"},
  {id:"sql-3", b:"sql", w:1, n:"DISTINCT", tip:"Removes duplicate rows from the result"},
  {id:"sql-4", b:"sql", w:1, n:"NULL handling", tip:"Use <code>IS NULL</code>, never <code>= NULL</code>. <code>COALESCE(x, 0)</code> swaps in a default"},
  {id:"sql-5", b:"sql", w:1, n:"Aggregations", tip:"<code>COUNT, SUM, AVG, MIN, MAX</code> collapse many rows into one value"},
  {id:"sql-6", b:"sql", w:2, n:"GROUP BY and HAVING", tip:"WHERE filters rows before grouping, HAVING filters groups after"},
  {id:"sql-7", b:"sql", w:2, n:"Joins (inner, left, right, full)", tip:"INNER keeps matches only. LEFT keeps every row from the left table"},
  {id:"sql-8", b:"sql", w:2, n:"CASE WHEN", tip:"If/else inside a query"},
  {id:"sql-9", b:"sql", w:2, n:"UNION and UNION ALL", tip:"UNION removes duplicates, UNION ALL keeps them (and is faster)"},
  {id:"sql-10", b:"sql", w:2, n:"Date and string functions", tip:"<code>strftime, SUBSTR, UPPER, TRIM</code>. Names vary by database"},
  {id:"sql-11", b:"sql", w:3, n:"CTEs", tip:"<code>WITH name AS (SELECT ...)</code>: a named temporary result"},
  {id:"sql-12", b:"sql", w:3, n:"Subqueries", tip:"A query inside a query, wrapped in parentheses"},
  {id:"sql-13", b:"sql", w:3, n:"Self joins", tip:"Join a table to itself using two aliases"},
  {id:"sql-14", b:"sql", w:3, n:"Window functions (ROW_NUMBER, RANK, LAG/LEAD, running totals)", tip:"<code>fn() OVER (PARTITION BY a ORDER BY b)</code>"},
  {id:"sql-15", b:"sql", w:4, n:"Deduplication patterns", tip:"<code>ROW_NUMBER()</code> per key, keep <code>rn = 1</code>"},
  {id:"sql-16", b:"sql", w:4, n:"Funnel, retention and cohort queries", tip:"Cohort = group by first-activity period"},
  {id:"sql-17", b:"sql", w:4, n:"JSON parsing", tip:"SQLite <code>json_extract</code>, Postgres <code>-&gt;&gt;</code>, BigQuery <code>JSON_VALUE</code>"},
  {id:"sql-18", b:"sql", w:4, n:"Query performance (EXPLAIN)", tip:"<code>EXPLAIN</code> shows the plan. Watch for full scans"},
  {id:"py-1", b:"py", w:1, n:"Python basics: variables, types, loops, conditionals", tip:"Variables, <code>for</code>, <code>if</code>"},
  {id:"py-2", b:"py", w:2, n:"Lists, dicts, sets, comprehensions", tip:"<code>[x*2 for x in nums if x &gt; 0]</code>"},
  {id:"py-3", b:"py", w:3, n:"Functions, files, and error handling", tip:"<code>def</code>, <code>return</code>, <code>try/except</code>"},
  {id:"py-4", b:"py", w:4, n:"pandas basics: DataFrame, select, filter", tip:"<code>df[df.age &gt; 30]</code>"},
  {id:"py-5", b:"py", w:5, n:"pandas: groupby, merge, pivot", tip:"groupby = GROUP BY, merge = JOIN"},
  {id:"py-6", b:"py", w:6, n:"Data cleaning: nulls, types, duplicates, dates", tip:"<code>fillna, dropna, astype, drop_duplicates</code>"},
  {id:"py-7", b:"py", w:7, n:"Visualization: matplotlib and seaborn", tip:"Line for trends, bar for comparisons"},
  {id:"py-8", b:"py", w:8, n:"APIs and JSON with requests", tip:"<code>requests.get(url).json()</code>"},
  {id:"py-9", b:"py", w:9, n:"SQL from Python (sqlite3 / SQLAlchemy)", tip:"<code>pd.read_sql(query, conn)</code>"},
  {id:"py-10", b:"py", w:10, n:"Capstone: end-to-end mini project", tip:"Pull, clean, analyze, chart, write up"},
  {id:"dm-1", b:"dm", w:5, n:"Primary and foreign keys", tip:"PK identifies a row. FK points to another table's PK"},
  {id:"dm-2", b:"dm", w:5, n:"Fact vs dimension tables", tip:"Facts = events and numbers. Dimensions = descriptions"},

/* ============ LESSON BUILDERS ============ */
const say   = h => ({k:"say", h});
const terms = arr => ({k:"terms", arr});
const ex    = (code, o={}) => ({k:"ex", code, lang:o.lang||"sql", run:o.run!==false, out:o.out, note:o.note});
const sq    = o => Object.assign({k:"sql"}, o);
const mc    = o => Object.assign({k:"mc"}, o);

const LESSONS = {
/* ---------- SQL ---------- */
"sql-1": {key:"SELECT picks the columns, FROM picks the table, WHERE picks the rows.", beats:[
  say(`<span class="tag">Analogy</span><p>Picture a <b>giant filing room</b>. Each cabinet holds one kind of thing: customers, orders, products. Inside is a neat grid of records.</p><p>SQL is the polite note you hand the clerk: "From the customers cabinet, bring me the names and cities of everyone over 30." You never dig through the drawers yourself.</p>`),
  terms([["Table","one cabinet: a grid of data about one kind of thing"],["Row","one record in the grid, like one customer"],["Column","one attribute, like <code>name</code> or <code>city</code>"],["Query","a request you write in SQL"],["Filter","a rule that decides which rows come back"]]),
  ex(`SELECT name, city\nFROM customers\nWHERE age > 30;`, {note:"Read it aloud: select these columns, from this table, where this is true. SELECT only reads. It never changes the data."}),
  sq({prompt:"Return the <b>name</b> and <b>age</b> of customers who live in <b>Edison</b>.", tables:["customers"], sol:"SELECT name, age FROM customers WHERE city = 'Edison';", hint:"Text values go in single quotes: <code>WHERE city = 'Edison'</code>."})
]},
"sql-2": {key:"ORDER BY sorts the result. DESC flips it. LIMIT keeps the first N rows.", beats:[
  say(`<span class="tag">Analogy</span><p>Think of a teacher handing back exams. Before she does, she sorts the stack by score, highest on top, then picks off the first three for the "top scorers" board.</p>`),
  terms([["ORDER BY","sort the result by a column"],["ASC / DESC","low to high / high to low (ASC is the default)"],["LIMIT","keep only the first N rows after sorting"]]),
  ex(`SELECT name, age\nFROM customers\nORDER BY age DESC\nLIMIT 3;`),
  sq({prompt:"Show the <b>id</b> and <b>amount</b> of the <b>3 largest orders</b>, biggest first.", tables:["orders"], ordered:true, sol:"SELECT id, amount FROM orders ORDER BY amount DESC LIMIT 3;", hint:"Sort by amount in descending order, then cap it with LIMIT 3."})
]},
"sql-3": {key:"DISTINCT collapses repeated rows so each value appears once.", beats:[
  say(`<span class="tag">Analogy</span><p>You are making a guest list from RSVP cards, but some people replied twice. You want each name <b>once</b>.</p>`),
  terms([["Duplicate","a row that repeats another row exactly"],["DISTINCT","keep only one copy of each unique row"]]),
  ex(`SELECT DISTINCT city\nFROM customers;`, {note:"Notice NULL appears as its own value. We will meet NULL properly soon."}),
  sq({prompt:"List each <b>unique order status</b>, sorted A to Z.", tables:["orders"], ordered:true, sol:"SELECT DISTINCT status FROM orders ORDER BY status;", hint:"<code>SELECT DISTINCT status FROM orders</code> then add an ORDER BY."})
]},
"sql-4": {key:"NULL means unknown. Test it with IS NULL, and replace it with COALESCE.", beats:[
  say(`<span class="tag">Analogy</span><p>An empty box on a paper form does not mean "zero". It means <b>"we don't know"</b>. Is the missing age 0? 30? Nobody can say, so comparisons with it never come out true or false.</p>`),
  terms([["NULL","a missing or unknown value"],["IS NULL","the correct way to test for missing. <code>= NULL</code> never works"],["COALESCE","takes the first value that is not NULL, so you can supply a backup"]]),
  ex(`SELECT name, COALESCE(city, 'Unknown') AS city\nFROM customers;`),
  sq({prompt:"Return <b>name</b> and <b>city</b> for every customer, showing <b>'Unknown'</b> when the city is missing.", tables:["customers"], sol:"SELECT name, COALESCE(city,'Unknown') AS city FROM customers;", hint:"<code>COALESCE(city, 'Unknown')</code> inside the SELECT list."})
]},
"sql-5": {key:"Aggregates squash many rows into one value. COUNT(*) counts rows, COUNT(col) skips NULLs.", beats:[
  say(`<span class="tag">Analogy</span><p>A cashier's end-of-day tally. Hundreds of receipts go in, and out come a few numbers: how many sales, the total, the biggest.</p>`),
  terms([["Aggregate function","takes many rows and returns one value"],["COUNT","how many rows (or non-NULL values)"],["SUM / AVG","total / average. NULLs are ignored"],["MIN / MAX","smallest / largest"]]),
  ex(`SELECT COUNT(*) AS orders,\n       SUM(amount) AS revenue,\n       AVG(amount) AS average\nFROM orders\nWHERE status = 'paid';`),
  sq({prompt:"How many <b>paid</b> orders are there, and what is their <b>total amount</b>? Return two columns: the count, then the total.", tables:["orders"], sol:"SELECT COUNT(*), SUM(amount) FROM orders WHERE status='paid';", hint:"<code>COUNT(*)</code> and <code>SUM(amount)</code> in one SELECT, with a WHERE on status."})
]},
"sql-6": {key:"WHERE filters rows before grouping. HAVING filters groups after.", beats:[
  say(`<span class="tag">Analogy</span><p>You dump a shoebox of receipts and sort them into <b>piles by customer</b>. Then you total each pile. Finally you throw away piles under $100. Sorting into piles is GROUP BY. Throwing away small piles is HAVING.</p>`),
  terms([["GROUP BY","split rows into groups, giving one result row per group"],["HAVING","a filter applied to groups, after the totals exist"],["WHERE vs HAVING","WHERE cannot see totals yet. HAVING can"]]),
  ex(`SELECT customer_id, SUM(amount) AS total\nFROM orders\nWHERE status = 'paid'\nGROUP BY customer_id\nHAVING SUM(amount) > 100;`),
  sq({prompt:"For each <b>customer_id</b>, count their orders. Keep only customers with <b>2 or more</b> orders.", tables:["orders"], sol:"SELECT customer_id, COUNT(*) AS n FROM orders GROUP BY customer_id HAVING COUNT(*) >= 2;", hint:"GROUP BY customer_id, then <code>HAVING COUNT(*) &gt;= 2</code>."})
]},
"sql-7": {key:"A join matches rows across tables using a shared key. LEFT JOIN keeps every left row.", beats:[
  say(`<span class="tag">Analogy</span><p>You have a guest list and a separate seating chart. To see who sits where, you match them using a shared <b>guest ID</b>. That matching step is a join.</p><p>An <b>inner</b> join shows only guests who appear in both lists. A <b>left</b> join shows every guest, even those without a seat yet (their seat shows as blank).</p>`),
  terms([["Join","combine rows from two tables by matching a column"],["Key","the shared column used to match, like <code>customer_id</code>"],["INNER JOIN","only rows that match in both tables"],["LEFT JOIN","all rows from the left table, NULLs where there is no match"],["RIGHT / FULL JOIN","right keeps all of the right table. full keeps everything from both (not available in every database)"],["Alias","a short nickname for a table, like <code>c</code> for customers"]]),
  ex(`SELECT c.name, o.amount\nFROM customers c\nINNER JOIN orders o ON o.customer_id = c.id;`, {note:"Elena and Hugo have no orders, so an INNER JOIN drops them."}),
  sq({prompt:"List every customer's <b>name</b> with their <b>number of orders</b>, including customers with <b>zero</b> orders.", tables:["customers","orders"], sol:"SELECT c.name, COUNT(o.id) AS n FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id;", hint:"Use LEFT JOIN so nobody disappears, and <code>COUNT(o.id)</code> (not COUNT(*)) so a missing order counts as 0."})
]},
"sql-8": {key:"CASE WHEN is if/else inside a query. The first matching WHEN wins.", beats:[
  say(`<span class="tag">Analogy</span><p>A bouncer's rulebook: if you are under 21, you get a wristband that says "no drinks". Otherwise, "all good". Each person goes through the same rules and gets a label.</p>`),
  terms([["CASE WHEN","checks conditions in order and returns a value for the first that is true"],["ELSE","the fallback when no condition matches"],["END","closes the CASE block"]]),
  ex(`SELECT name,\n       CASE WHEN age < 30 THEN 'under 30'\n            WHEN age >= 30 THEN '30 plus'\n            ELSE 'unknown' END AS age_group\nFROM customers;`),
  sq({prompt:"For each order, return <b>id</b> and a label called <b>size</b>: <b>'big'</b> if the amount is 100 or more, otherwise <b>'small'</b>.", tables:["orders"], sol:"SELECT id, CASE WHEN amount >= 100 THEN 'big' ELSE 'small' END AS size FROM orders;", hint:"<code>CASE WHEN amount &gt;= 100 THEN 'big' ELSE 'small' END</code>", must:[{re:/\bcase\b/i,msg:"Use a CASE WHEN expression for this one."}]})
]},
"sql-9": {key:"UNION stacks results and removes duplicates. UNION ALL stacks and keeps everything.", beats:[
  say(`<span class="tag">Analogy</span><p>Two clubs each have a member list. You tape one list under the other to make a single sheet. Do you cross out people who are in both clubs? If yes, that is UNION. If you keep both lines, that is UNION ALL.</p>`),
  terms([["UNION","stack two results into one and remove duplicate rows"],["UNION ALL","stack them and keep every row. Faster, because it skips the duplicate check"],["Rule","both queries need the same number of columns with compatible types"]]),

]},
"sql-10": {key:"Date and string functions reshape values. Names differ by database, the ideas do not.", beats:[
  say(`<span class="tag">Analogy</span><p>A kitchen prep station. You trim, chop and combine ingredients before cooking. With dates you slice a calendar: "just the month". With text you trim, change case, or cut out a piece.</p>`),
  terms([["Function","a built-in tool that takes a value and returns a changed one"],["strftime","SQLite's date formatter, like <code>strftime('%Y-%m', date)</code>. Postgres uses <code>DATE_TRUNC</code> or <code>EXTRACT</code>"],["SUBSTR, UPPER, LOWER, TRIM, LENGTH","common text tools"],["||","joins text in SQLite and Postgres (<code>CONCAT</code> in MySQL)"]]),
  ex(`SELECT name,\n       UPPER(name) AS shout,\n       strftime('%Y-%m', signup_date) AS signup_month\nFROM customers;`),
  sq({prompt:"What is the <b>total amount of paid orders</b> for each <b>order month</b>? Return the month (like 2026-03) and the total, sorted by month.", tables:["orders"], ordered:true, sol:"SELECT strftime('%Y-%m', order_date) AS month, SUM(amount) AS total FROM orders WHERE status='paid' GROUP BY month ORDER BY month;", hint:"Combine strftime, a WHERE on status, GROUP BY, and SUM."})
]},
"sql-11": {key:"A CTE gives a subquery a name so a big query reads top to bottom.", beats:[

  sq({prompt:"Using a <b>CTE</b>, compute each customer's <b>paid total</b>, then return the <b>name</b> and <b>total</b> of customers whose total is <b>200 or more</b>.", tables:["customers","orders"], sol:"WITH t AS (SELECT customer_id, SUM(amount) AS total FROM orders WHERE status='paid' GROUP BY customer_id) SELECT c.name, t.total FROM customers c JOIN t ON t.customer_id=c.id WHERE t.total >= 200;", hint:"Build the totals in <code>WITH totals AS (...)</code>, then join it to customers and filter.", must:[{re:/\bwith\b/i,msg:"This one is practice for CTEs, so start with WITH."}]})

"sql-12": {key:"A subquery is a query in parentheses that feeds its answer to the outer query.", beats:[

]},
"sql-13": {key:"A self join treats one table as two, using aliases to tell the copies apart.", beats:[

]},
"sql-14": {key:"Window functions add a calculation next to each row without collapsing the rows.", beats:[
  say(`<span class="tag">Analogy</span><p>A race. Each runner keeps their own row, but we add a <b>"finishing place"</b> column. GROUP BY would merge all runners into one line. A window function keeps everyone and just adds information.</p>`),
  terms([["Window function","a calculation across related rows that keeps every row"],["OVER","describes the window: which rows to look at"],["PARTITION BY","restart the calculation for each group, like each department"],["ROW_NUMBER","1, 2, 3... with no ties"],["RANK","ties share a place, then the next place is skipped (1, 2, 2, 4)"]]),
  ex(`SELECT name, dept, salary,\n  ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) AS rn,\n  RANK()       OVER (PARTITION BY dept ORDER BY salary DESC) AS rnk\nFROM employees;`, {note:"Look at Quinn and Rosa in Sales. They tie at 85000. ROW_NUMBER breaks the tie arbitrarily, RANK gives them the same place."}),
  sq({prompt:"Mini-challenge 1 of 3. Rank employees <b>within each department</b> by salary (highest = 1) using <b>RANK</b>. Return name, dept, and the rank.", tables:["employees"], sol:"SELECT name, dept, RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS rnk FROM employees;", hint:"<code>RANK() OVER (PARTITION BY dept ORDER BY salary DESC)</code>", must:[{re:/\bover\b/i,msg:"A window function needs an OVER (...) clause."}]}),

  say(`<span class="tag">Last idea: running totals</span><p>A running total is like a <b>savings jar counter</b>: after each deposit, the total on the jar so far. Use <code>SUM(...) OVER (ORDER BY ...)</code>.</p>`),
  sq({prompt:"Mini-challenge 3 of 3. Return <b>month</b> and the <b>running total</b> of revenue up to and including that month.", tables:["monthly_revenue"], ordered:true, sol:"SELECT month, SUM(revenue) OVER (ORDER BY month) AS running FROM monthly_revenue ORDER BY month;", hint:"<code>SUM(revenue) OVER (ORDER BY month)</code>", must:[{re:/\bover\b/i,msg:"Use SUM(...) OVER (ORDER BY ...)."}]})
]},
"sql-15": {key:"Dedupe with ROW_NUMBER: number the rows within each key, then keep rn = 1.", beats:[
  say(`<span class="tag">Analogy</span><p>Your phone has three contact cards for the same person. To clean up you group the cards by person, put them in order from newest to oldest, and keep only the <b>first</b> one in each group.</p>`),

  ex(`WITH ranked AS (\n  SELECT *,\n    ROW_NUMBER() OVER (PARTITION BY email ORDER BY updated_at DESC) AS rn\n  FROM contacts\n)\nSELECT id, email, updated_at\nFROM ranked\nWHERE rn = 1;`, {note:"This keeps the newest row per email."}),

"sql-16": {key:"A funnel counts how many users reach each step. Retention counts how many come back.", beats:[

const PYKW = new Set("def return if elif else for in while import from as try except print range len not and or True False None".split(" "));
function hl(code, lang){
  const kw = lang==="py" ? PYKW : SQLKW;
  const re = /(--[^\n]*|#[^\n]*)|('(?:[^']|'')*'|"[^"\n]*")|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z_0-9]*)/g;
  let out="", last=0, m;
  while((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    if(m[1]) out += ((lang==="py" && m[1][0]==="#") || (lang!=="py" && m[1][0]==="-")) ? `<span class="c">${esc(m[1])}</span>` : esc(m[1]);
    else if(m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if(m[3]) out += `<span class="n">${m[3]}</span>`;

    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

/* ============ SQL ENGINE (sql.js, loaded on demand) ============ */
let SQLMOD=null, sqlPromise=null, sqlFailed=false;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Could not load "+src)); document.head.appendChild(s); }); }
function ensureSql(){
  if(SQLMOD) return Promise.resolve(SQLMOD);
  if(sqlPromise) return sqlPromise;
  const bases = ["https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/","https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/"];
  sqlPromise = (async()=>{
    let lastErr;
    for(const base of bases){
      try{
        if(!window.initSqlJs) await loadScript(base+"sql-wasm.js");
        SQLMOD = await window.initSqlJs({locateFile:f=>base+f});
        sqlFailed=false; return SQLMOD;
      }catch(e){ lastErr=e; }
    }
    sqlFailed=true; sqlPromise=null; throw lastErr;
  })();
  return sqlPromise;
}
function runSql(sql){
  const db = new SQLMOD.Database();
  try{ db.exec(SEED); const res = db.exec(sql); return res.length ? res[res.length-1] : null; }
  finally{ db.close(); }
}
const normV = v => v===null ? "∅" : typeof v==="number" ? String(Math.round(v*100)/100) : String(v);
function gradeSql(ch, userSql){
  let user;
  try{ user = runSql(userSql); }catch(e){ return {ok:false, msg:`The database said: <code>${esc(e.message)}</code>. Check spelling, commas, and quotes, then try again.`}; }
  if(!user) return {ok:false, msg:"That ran, but it did not return a table. End your query with a SELECT so I can see the rows."};
  for(const m of (ch.must||[])) if(!m.re.test(userSql)) return {ok:false, msg:m.msg};
  if(ch.check) return ch.check(user) ? {ok:true, res:user} : {ok:false, msg:ch.checkMsg||"Not quite yet.", res:user};
  const exp = runSql(ch.sol);
  if(user.columns.length !== exp.columns.length) return {ok:false, res:user, msg:`Your result has <b>${user.columns.length}</b> column${user.columns.length===1?"":"s"}, but I expected <b>${exp.columns.length}</b>. Re-read what the question asks me to return.`};
  const ru = user.values.map(r=>r.map(normV).join("|")), re = exp.values.map(r=>r.map(normV).join("|"));
  if(ru.length !== re.length){
    const more = ru.length > re.length;
    return {ok:false, res:user, msg:`Your query returned <b>${ru.length}</b> row${ru.length===1?"":"s"}, but I expected <b>${re.length}</b>. ${more?"You may need a filter, or DISTINCT, or a smaller group.":"Your filter might be too strict, or an INNER JOIN may be dropping rows."}`};
  }
  const su = ru.slice().sort().join("\n"), se = re.slice().sort().join("\n");
  if(su !== se) return {ok:false, res:user, msg:"The right number of rows and columns, but some values are different. Check your calculation and any conditions."};
  if(ch.ordered && ru.join("\n") !== re.join("\n")) return {ok:false, res:user, msg:"Right rows, wrong order. Check your ORDER BY (and ASC or DESC)."};
  return {ok:true, res:user};
}

/* ============ TIMERS ============ */
const allTasks = () => { const a=[]; Object.values(S.days).forEach(d=>d.tasks.forEach(t=>a.push(t))); return a; };
const findTask = id => allTasks().find(t=>t.id===id);
function pauseAll(except){ allTasks().forEach(t=>{ if(t.since && t.id!==except){ t.spent+=(Date.now()-t.since)/1000; t.since=null; } }); }
let audioCtx;
function beep(){
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(off=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value=880; const t0=audioCtx.currentTime+off;
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.25,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.2); o.start(t0); o.stop(t0+0.22); });
  }catch(e){}
}
function toggleTimerFor(t){
  if(t.since){ t.spent+=(Date.now()-t.since)/1000; t.since=null; }
  else{ pauseAll(t.id); t.since=Date.now();
    try{ if("Notification" in window && Notification.permission==="default") Notification.requestPermission(); }catch(e){}
    try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(e){} }
}
function tick(){
  let running=null, need=false;
  allTasks().forEach(t=>{ if(t.since){ running=t; if(!t.alerted && elapsed(t)>=t.target*60){ t.alerted=true; need=true; beep(); try{ if("Notification" in window && Notification.permission==="granted") new Notification("Time is up",{body:t.title}); }catch(e){} } } });
  if(need) save();
  document.querySelectorAll("[data-time]").forEach(el=>{ const t=findTask(el.dataset.time); if(t) el.textContent=fmt(elapsed(t)); });
  document.querySelectorAll("[data-ring]").forEach(el=>{ const t=findTask(el.dataset.ring); if(t) el.setAttribute("stroke-dashoffset", RING_C*(1-Math.min(1,elapsed(t)/(t.target*60)))); });
  if(S.tab==="today" && S.days[viewDate]){
    Object.keys(CATS).forEach(k=>{ const logged=S.days[viewDate].tasks.filter(t=>t.cat===k).reduce((a,t)=>a+elapsed(t),0);
      const bar=document.querySelector(`[data-blockbar="${k}"]`); if(bar) bar.style.width=Math.min(100,logged/Math.max(1,S.settings.blocks[k].hours*3600)*100)+"%";
      const lb=document.querySelector(`[data-blocklog="${k}"]`); if(lb) lb.textContent=fmt(logged)+" logged"; });
  }
  document.title = running ? fmt(elapsed(running))+" · "+running.title : "Sprint · 10-Week Planner and Coach";
}
setInterval(tick,1000);
document.addEventListener("visibilitychange",tick);

document.addEventListener("click", e=>{

    case "lessonToday": { const t=lessonTask(id,true); if(!t.since) toggleTimerFor(t); save(); openLesson(id); break; }
    case "practice": S.practice[id]=Math.max(0,(S.practice[id]||0)+(+el.dataset.d)); save(); render(); break;
    case "addApp": addApp(); break;
    case "delApp": S.apps=S.apps.filter(x=>x.id!==id); save(); render(); break;
    case "export": { pauseAll(); save(); const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const url=URL.createObjectURL(blob); const a2=document.createElement("a"); a2.href=url; a2.download="sprint-backup-"+todayStr()+".json"; a2.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); break; }

      else { st.tries++; S.coach.fails[LS.id]=(S.coach.fails[LS.id]||0)+1; st.fb={ok:false,msg:g.msg}; }
      save(); maybeFinish(); render(); break; }
    case "hintSql": { const b=LESSONS[LS.id].beats[i], st=chState(i,b); syncEditor(i); if(!st.hint){ st.hint=true; S.coach.hints++; save(); } render(); break; }

    case "mcPick": { const b=LESSONS[LS.id].beats[i], st=chState(i,b), o=+el.dataset.o;

});
function addTask(cat){
  const inp=document.getElementById("new-"+cat), mins=document.getElementById("min-"+cat), title=inp.value.trim();
  if(!title){ inp.focus(); return; }
  getDay(viewDate).tasks.push({id:uid(),cat,title,target:Math.max(1,+mins.value||30),spent:0,since:null,done:false,alerted:false});
  save(); render(); const again=document.getElementById("new-"+cat); if(again) again.focus();
}
function addApp(){
  const c=document.getElementById("app-company"), r=document.getElementById("app-role");
  if(!c.value.trim()){ c.focus(); return; }
  S.apps.push({id:uid(),company:c.value.trim(),role:r.value.trim()||"Role not set",status:"Applied",date:todayStr()});
  save(); render(); document.getElementById("app-company").focus();
}

/* ============ INIT ============ */
if(!NAV.some(n=>n[0]===S.tab)) S.tab="coach";
render();
</script>
